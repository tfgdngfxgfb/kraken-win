name: Test and build

on:
  push:
    branches: [main]
    tags-ignore: ['archive/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  lint_and_test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-2022' && 120 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.14', '3.15']
        # SLEEF's MSVC probe fails with the VS 2026 image. Build cp315
        # bindings with the VS 2022 toolchain used for local validation.
        exclude:
          - os: windows-latest
            python-version: '3.15'
        include:
          - os: windows-2022
            python-version: '3.15'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Build corrected PyTorch bindings for Windows Python 3.15
        if: runner.os == 'Windows' && matrix.python-version == '3.15'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsRoot) { throw 'MSVC x64 build tools are required' }
          & "$vsRoot\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          python maintenance/windows315/build_torch315.py --build CPU --work-dir .local/torch315-build --output-dir .local/torch315-wheels --jobs 4
          if ($LASTEXITCODE -ne 0) { throw 'PyTorch binding build failed' }
          python -m pip install --no-deps .local/torch315-wheels/torch-2.14.1+pylaia315cpu-cp315-cp315-win_amd64.whl
      - name: Build scikit-image for Windows Python 3.15
        if: runner.os == 'Windows' && matrix.python-version == '3.15'
        shell: pwsh
        env:
          CC: clang-cl
          CXX: clang-cl
        run: |
          $env:PATH = "C:\Program Files\LLVM\bin;" + $env:PATH
          clang-cl --version
          python -m pip install "scikit-image>=0.26.0,<0.27" --config-settings "setup-args=--vsenv" --config-settings "setup-args=-Dinclude-v2=false"
      - name: Install CPU PyTorch
        if: runner.os != 'Windows' || matrix.python-version != '3.15'
        run: python -m pip install "torch>=2.14.1,<2.15" "torchvision>=0.29.1,<0.30" --index-url https://download.pytorch.org/whl/cpu --no-deps
      - name: Install matching TorchVision for Windows Python 3.15
        if: runner.os == 'Windows' && matrix.python-version == '3.15'
        run: python -m pip install "torchvision>=0.29.1,<0.30" --index-url https://download.pytorch.org/whl/cpu --no-deps
      - name: Install dependencies and kraken
        run: python -m pip install ".[test,pdf]" flake8
      - name: Check dependency consistency
        run: python -m pip check
      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 kraken tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 kraken tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Run tests
        run: |
          python -m pytest -vv -m "not network and not slow" --maxfail=3 -o faulthandler_timeout=120

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install ".[docs]"
      - run: python -m sphinx -b html docs build/html

  build:
    name: Build installation packages / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: lint_and_test
    strategy:
      matrix:
        python-version: ['3.14', '3.15']

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install pypa/build
      run: >-
        python3 -m
        pip install
        build
        --user
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
