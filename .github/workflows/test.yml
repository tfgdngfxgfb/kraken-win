name: Test and build

# Automatic CI is paused at the owner's request until November 2026.
# Re-enable push/pull_request triggers no earlier than 2026-11-01.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PIP_CONSTRAINT: ${{ github.workspace }}/maintenance/dependency-constraints.txt
  PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/maintenance/dependency-constraints.txt

jobs:
  lint_and_test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 120 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.14', '3.15']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Prepare local SymPy compatibility wheel
        run: python maintenance/python-compat/build_compatibility.py --sympy-only --output .local/python-compat-wheels
      - name: Build scikit-image for Windows Python 3.15
        if: runner.os == 'Windows' && matrix.python-version == '3.15'
        shell: pwsh
        env:
          CC: clang-cl
          CXX: clang-cl
        run: |
          $env:PATH = "C:\Program Files\LLVM\bin;" + $env:PATH
          clang-cl --version
          python -m pip install "scikit-image>=0.26.0,<0.27" --config-settings "setup-args=--vsenv" --config-settings "setup-args=-Dinclude-v2=false"
      - name: Install official CPU PyTorch and TorchVision
        run: python -m pip install "torch==2.15.0" "torchvision==0.29.2" --index-url https://download.pytorch.org/whl/cpu --no-deps
      - name: Install dependencies and kraken
        run: python -m pip install --find-links .local/python-compat-wheels ".[test,pdf]" flake8
      - name: Check dependency consistency
        run: python -m pip check
      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 kraken tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 kraken tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Run tests
        run: |
          python -m pytest -vv -m "not network and not slow" -o faulthandler_timeout=120

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python maintenance/python-compat/build_compatibility.py --sympy-only --output .local/python-compat-wheels
      - run: python maintenance/docs-compat/build_compat_wheels.py --cache-dir .local/docs-upstream --output-dir .local/docs-compat-wheels
      - run: python -m pip install --find-links .local/python-compat-wheels --find-links .local/docs-compat-wheels ".[docs]"
      - run: python -m sphinx -b html docs build/html

  build:
    name: Build installation packages / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: lint_and_test
    strategy:
      matrix:
        python-version: ['3.14', '3.15']

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install pypa/build
      run: >-
        python3 -m
        pip install
        build
        --user
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
